# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"
silent: true
env:
  PROJECT:
    sh: 'echo "$(basename $(pwd))" | tr "[:upper:]" "[:lower:]"'
  LOCAL_BIN_PATH:
    sh: 'echo "{{.ROOT_DIR}}/.venv/bin"'
  BUILD_DATE:
    sh: "date '+%Y-%m-%d-%H:%M:%S'"
  BUILD_DATE_SHORT:
    sh: "date '+%Y-%m-%d-%H%M%S'"
  GIT_LATEST_TAG:
    sh: 'git tag -l 2>/dev/null | sort -r -V | head -n 1 2>/dev/null || echo "not a git repo"'
  TERM: screen-256color
  DOCS_PATH: "{{.ROOT_DIR}}/docs"
  PYTHON_VENV_PATH: "{{.ROOT_DIR}}/.venv"
  SCRIPT_PATH: "{{.ROOT_DIR}}/scripts"
  VERSION: '{{default "unknown" .GIT_LATEST_TAG}}'
  COMPOSE_BAKE: true

dotenv:
  - ".env"

includes:
  github:
    taskfile: ./tasks/Taskfile.github.yml
    optional: true

tasks:
  default:
    cmds:
      - |
        task -l

  show:
    desc: Show task variables
    cmds:
      - |
        echo "ROOT_PATH: {{.ROOT_DIR}}"
        echo "PROJECT: {{.PROJECT}}"
        echo "VERSION: {{.VERSION}}"
        echo "OS: {{OS}}"
        echo "ARCH: {{ARCH}}"
        echo "LOCAL_BIN_PATH: {{.LOCAL_BIN_PATH}}"
        echo "PYTHON_VENV_PATH: {{.PYTHON_VENV_PATH}}"
        echo "SCRIPT_PATH: {{.SCRIPT_PATH}}"
        echo "BUILD_DATE: {{.BUILD_DATE}}"
        echo "GIT_LATEST_TAG: {{.GIT_LATEST_TAG}}"

  show:all:
    desc: Show all variables for task namespaces
    cmds:
      - |
        echo "## Show ##";
        task show
        echo ""
        for taskitem in $(task -l | cut -d " " -f2 | grep show | sed 's/.$//'); do
          if [[ "$taskitem" != "show:all" ]]; then
            echo "## Show - ${taskitem} ##";
            task $taskitem;
            echo "";
          fi
        done

  list:
    desc: List tasks by namespace (task list -- <namespace>)
    cmds:
      - |
        if [[ "{{.CLI_ARGS}}" != "" ]]; then
          task -l | grep {{default "" .CLI_ARGS}}
        else
          task -l
        fi

  secrets:
    desc: Create .env file if one does not already exist.
    cmds:
      - cp ./.env.EXAMPLE ./.env
    status:
      - "test -f .env"

  autocomplete:
    desc: Setup task autocomplete (zsh)
    cmds:
      - sudo curl https://raw.githubusercontent.com/go-task/task/main/completion/zsh/_task \
        -o /usr/local/share/zsh/site-functions/_task
    status:
      - "test -f /usr/local/share/zsh/site-functions/_task"

  secret:search:
    desc: Find secrets in the codebase and in git history
    cmds:
      - |
        gitleaks detect --source ./ -f json -r secret_results.json

  clean:
    desc: Clean the project
    cmds:
      - |
        find . -type d -name "__pycache__" -exec rm -rf {} +
        find . -type d -name "*.egg-info" -exec rm -rf {} +
        find . -type f -name ".DS_Store" -delete
        find . -type f -name "*.pyc" -delete
        find . -type f -name "*.pyo" -delete
        rm -rf .mypy_cache
        rm -rf .pytest_cache
        rm -rf .ruff_cache
        rm -rf dist
        rm -rf .coverage
        rm -rf .coverage.*
        rm -rf .coverage.xml
        rm -rf .DS_Store
        rm -rf .pytest_cache
        rm -rf .venv
        rm -rf src/terraform_ingest/_version.py
        rm -rf chromadb
        rm -rf ./output
        rm -rf ./repos
        rm -rf ./site

  repomix:
    desc: Run the repo mixin
    cmds:
      - |
        repomix --style=markdown --output=docs/repomix.md --compress

  build:image:
    desc: Build Docker images
    cmds:
      - task: docker:build
        vars:
          DOCKER_BUILD_ARGS: "--build-arg DEPLOY_VERSION={{.VERSION}}-$(git rev-parse --short HEAD)"

  build:all:
    desc: Build CLI package, docs site, and Docker image
    cmds:
      - task: cli:build
      - task: docs:build
      - task: build:image

  skills:sync:
    desc: Sync repo-root public skills into package data for wheel bundling
    cmds:
      - uv run python scripts/sync_bundled_skills.py

  cli:build:
    desc: Build CLI package (sdist + wheel)
    cmds:
      - task: skills:sync
      - rm -rf dist
      - uv build

  docs:build:
    desc: Build the MkDocs site into ./site
    cmds:
      - uv sync --frozen --all-extras
      - uv run secretzero schema export --output docs/Secretfile.schema.json
      - task: docs:generate:provider-bundles
      - uv run mkdocs build --clean

  docs:serve:
    desc: Serve MkDocs locally with live reload
    cmds:
      - uv sync --frozen --all-extras
      - uv run secretzero schema export --output docs/Secretfile.schema.json
      - task: docs:generate:provider-bundles
      - uv run mkdocs serve --dev-addr 127.0.0.1:8001

  docs:generate:provider-bundles:
    desc: Generate auto-reference docs for provider bundles
    cmds:
      - uv run python scripts/generate_provider_bundle_docs.py --output docs/reference/provider-bundles-auto.md

  docs:links:
    desc: Check hyperlinks in README.md and docs/ (lychee)
    cmds:
      - |
        if ! command -v lychee >/dev/null 2>&1; then
          echo "lychee not found. Install with: mise install  (see mise.toml) or https://github.com/lycheeverse/lychee"
          exit 1
        fi
        lychee --config lychee.toml README.md docs/

  docker:build:
    desc: Build a Docker image from a Dockerfile
    vars:
      DOCKER_IMAGE: '{{default "secretzero:latest" .DOCKER_IMAGE}}'
      DOCKERFILE: '{{default "Dockerfile" .DOCKERFILE}}'
      DOCKER_CONTEXT: '{{default "." .DOCKER_CONTEXT}}'
      DOCKER_BUILD_ARGS: '{{default "" .DOCKER_BUILD_ARGS}}'
    preconditions:
      - sh: 'test -f "{{.DOCKERFILE}}"'
        msg: "Dockerfile not found. Create one or pass DOCKERFILE=path/to/Dockerfile."
    cmds:
      - |
        docker build -f "{{.DOCKERFILE}}" -t "{{.DOCKER_IMAGE}}" {{.DOCKER_BUILD_ARGS}} "{{.DOCKER_CONTEXT}}"

  update:github:actions:
    desc: Update GitHub Actions in workflows
    cmds:
      - npx actions-up -y

  schema:to:yaml:
    desc: Convert JSON schema files to YAML
    cmds:
      - |
        for file in $(find ./schemas -type f -name "*.json"); do
          uv run ./scripts/jsonschema-to-yaml.py "$file" --force > "${file%.json}.yaml"
          #yq eval -P "$file" > "${file%.json}.yaml"
          echo "Converted $file to ${file%.json}.yaml"
        done

  lint:
    desc: Run python linting
    cmds:
      - |
        uv pip install -e ".[dev]"
        uv run ruff check . --exclude=docs --exclude=site --exclude=tests --exclude=examples --exclude=ent-site --exclude=.cursor --exclude=./.venv --exclude=src/secretzero/_version.py --exclude=node_modules
        uv run black --check .

  lint:fix:
    desc: Run python linting and fix issues
    cmds:
      - |
        uv run ruff check --fix . --exclude=docs --exclude=site --exclude=tests --exclude=examples --exclude=ent-site --exclude=.cursor --exclude=.venv --exclude=src/secretzero/_version.py --exclude=node_modules

  security:scan:
    desc: Run Python security scans (dependencies + code)
    cmds:
      - |
        uv sync --frozen --all-extras
        uv run pip-audit
        uv run bandit -r src -ll

  deps:sync-floors:
    desc: Align pyproject.toml >= floors with resolved versions in uv.lock
    cmds:
      - python3 scripts/sync_pyproject_dep_floors.py

  deps:upgrade:
    desc: Upgrade locked dependencies and sync pyproject.toml version floors
    cmds:
      - |
        uv lock --upgrade
        python3 scripts/sync_pyproject_dep_floors.py
        uv lock --upgrade
        python3 scripts/sync_pyproject_dep_floors.py
        uv sync --all-extras

  deps:upgrade:verify:
    desc: Upgrade dependencies then run full QA gate (tests, security, validations, docs links)
    cmds:
      - task: deps:upgrade
      - ./scripts/agent.pre-commit.sh --mode full --quiet
  
  test:
    desc: Run the tests
    cmds:
      - |
        uv sync --frozen --all-extras
        uv run pytest --maxfail=1 --disable-warnings -v tests --ignore=tests/e2e

  test:e2e:
    desc: Run Tavern HTTP E2E tests (requires dev extras)
    cmds:
      - |
        uv sync --frozen --all-extras
        uv run pytest --maxfail=1 --disable-warnings -v tests/e2e

  format:
    desc: Run python formatting
    cmds:
      - |
        uv run ruff format .
        uv run black .

  test:validations:
    desc: Run validation tests for all example Secretfile manifests
    cmds:
      - |
        uv pip install -e ".[all]"
        for file in $(find ./examples -type f -name "*.yml"); do
          echo "Running validation test: $file"
          uv run secretzero validate -f "$file"
        done
  
  docs:publish:
    desc: Publish docs to Cloudflare Pages
    cmds:
      - |
        npm ci --ignore-scripts
        #npx wrangler login --api-token $CLOUDFLARE_API_TOKEN
        npx wrangler pages deploy site/ --project-name secretzero --branch main

  demo:install:
      desc: "Install demo recording dependencies"
      cmds:
        - |
          uv sync --frozen --all-extras

  demo:record:
    desc: "Record CLI demos and convert to SVG"
    cmds:
      - |
        bash scripts/record-demos.sh

  demo:clean:
    desc: "Clean demo recordings"
    cmds:
      - |
        rm -f demos/*.cast demos/*.cast.sh

  demo:shrink:
    desc: "Shrink demo recording using gifsicle"
    cmds:
      - |
        for file in $(find ./docs/inc/demos -type f -name "*.gif"); do
          gifsicle -O3 "$file" -o "$file" --colors 256
          echo "Shrunk $file"
        done

  demo:
    desc: "Run all demo tasks"
    cmds:
      - task: demo:install
      - task: demo:record
      - task: demo:clean
      - task: demo:shrink

  schema:update:
    desc: Update root Secretfile.schema.yaml
    cmds:
      - uv run secretzero schema export > ./Secretfile.schema.json
