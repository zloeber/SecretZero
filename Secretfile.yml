# yaml-language-server: $schema=Secretfile.schema.json
version: '1.0'

variables:
  github_org: zloeber
  github_repo: SecretZero

providers:
  github:
    kind: github
    auth:
      kind: token
      config:
        token: ${GITHUB_TOKEN}

secrets:
  # Cloudflare Pages API token for deployment of documentation site to docs.secret0.com
  - name: cloudflare_pages_api_token
    kind: static
    config:
      default: ${CLOUDFLARE_PAGES_API_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
          secret_name: CLOUDFLARE_PAGES_API_TOKEN
          #create_environment: true
  # # TestPyPI API token for test releases
  # - name: testpypi_token
  #   kind: static
  #   config:
  #     default: ${TESTPYPI_TOKEN}
  #   targets:
  #     - provider: github
  #       kind: github_secret
  #       config:
  #         owner: ${github_org}
  #         repo: ${github_repo}
  #         secret_name: PYPI_API_TOKEN
  #         environment: testpypi
  #         #create_environment: true

  # # Production PyPI API token for official releases
  # - name: production_token
  #   kind: static
  #   config:
  #     default: ${PRODUCTION_TOKEN}
  #   targets:
  #     - provider: github
  #       kind: github_secret
  #       config:
  #         owner: ${github_org}
  #         repo: ${github_repo}
  #         secret_name: PYPI_API_TOKEN
  #         environment: production
  #         #create_environment: true

metadata:
  project: SecretZero
  owner: zloeber
  description: PyPI API tokens for SecretZero package publishing
  environments:
    - testpypi
    - production
