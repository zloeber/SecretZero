  #       kind: github_secret
  #       config:
  #         owner: ${github_org}
  #         repo: ${github_repo}
  #         secret_name: RELEASE_TOKEN
  # Cloudflare Pages API token for deployment of documentation site to docs.secret0.com
- name: cloudflare_pages_api_token
  kind: static
  config:
    default: ${CLOUDFLARE_PAGES_API_TOKEN}
  targets:
  - provider: github
    kind: github_secret
    config:
      owner: ${github_org}
      repo: ${github_repo}
      secret_name: CLOUDFLARE_PAGES_API_TOKEN
  - provider: local
    kind: file
    config:
      path: .env
      format: dotenv
      key: CLOUDFLARE_PAGES_API_TOKEN
  agent_instructions:
    summary: "Deploy the documentation site to Cloudflare Pages"
    steps:
      - action: "Visit https://dash.cloudflare.com/login"
        description: "Login to the Cloudflare dashboard"
      - action: "Navigate to https://dash.cloudflare.com/pages"
        description: "Navigate to the Pages dashboard"
      - action: "Click on the 'Create a new project' button"
        description: "Create a new project"
      - action: "Click on the 'Deploy' button"
        description: "Deploy the documentation site"
      - action: "Click on the 'View' button"
        description: "View the documentation site"
      - action: "Click on the 'Copy' button"
        description: "Copy the API key"
      - action: "Use this as the value to sync with SecretZero"
        description: "The API key will be used to authenticate with the Cloudflare Pages API"

# Production PyPI API token for official releases
- name: pypi_prod_api_token
  kind: static
  config:
    default: ${PYPI_PROD_API_TOKEN}
  agent_instructions:
    summary: "Sync the production PyPI API token with SecretZero"
    steps:
      - action: "Visit https://pypi.org/manage/account/"
        description: "Login to the PyPI account"
      - action: "Click on the 'API tokens' link in the left sidebar"
        description: "Navigate to the API tokens page"
      - action: "Click on the 'Create a new API token' button"
        description: "Create a new API token"
      - action: "Click on the 'Copy' button"
        description: "Copy the API token"
      - action: "Use this as the value to sync with SecretZero"
        description: "The API token will be used to authenticate with the PyPI API"
  targets:
    - provider: github
      kind: github_secret
      config:
        owner: ${github_org}
        repo: ${github_repo}
        secret_name: PYPI_API_TOKEN
        environment: production
    - provider: local
      kind: file
      config:
        path: .env
        format: dotenv
        key: PYPI_PROD_API_TOKEN

metadata:
  project: SecretZero
  owner: zloeber
  description: PyPI API tokens for SecretZero package publishing
  environments:
  - testpypi
  - production
