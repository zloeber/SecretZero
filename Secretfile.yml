# yaml-language-server: $schema=Secretfile.schema.json
version: '1.0'

variables:
  github_org: zloeber
  github_repo: SecretZero

providers:
  github:
    kind: github
    auth:
      kind: token
      config:
        token: ${GITHUB_TOKEN}

secrets:
  # ── Release token with write access to contents & PRs ──────────────
  # - name: release_token
