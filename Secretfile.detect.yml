# yaml-language-server: $schema=./Secretfile.schema.json
# Secretfile.detect.yml - Auto-detected secrets from SecretZero project
# Generated: February 21, 2026
# This file was generated by analyzing the project structure, configuration files,
# and secret scanning tools (gitleaks, trivy, trufflehog, detect-secrets).
# 
# Confidence Levels:
#   - HIGH: Secrets clearly referenced in actual config/code or found in .env
#   - MEDIUM: Patterns suggest these are needed based on CI/CD workflows or examples
#   - LOW: Found only in documentation or example files

version: '1.0'

variables:
  github_org: zloeber
  github_repo: SecretZero
  github_owner: zloeber

metadata:
  project: SecretZero
  owner: zloeber
  description: Detected secrets from SecretZero project analysis
  environments:
    - development
    - testpypi
    - production
  compliance:
    - security-best-practices

providers:
  github:
    kind: github
    auth:
      kind: token
      config:
        token: ${GITHUB_TOKEN}

  aws:
    kind: aws
    auth:
      kind: ambient
    config:
      region: us-east-1
    fallback_generator: static

  vault:
    kind: vault
    auth:
      kind: token
      config:
        url: ${VAULT_ADDR}
        token: ${VAULT_TOKEN}

secrets:
  # ============================================================================
  # PRODUCTION SECRETS - HIGH CONFIDENCE
  # ============================================================================
  # These are confirmed secrets found in .env, Secretfile.yml, and workflows.
  
  - name: pypi_api_token_production
    description: PyPI API token for publishing official SecretZero releases to PyPI
    kind: static
    config:
      default: ${PYPI_API_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_owner}
          repo: ${github_repo}
          secret_name: PYPI_API_TOKEN
          environment: production
    rotation_period: 90d

  - name: testpypi_token
    description: TestPyPI API token for publishing test releases to TestPyPI
    kind: static
    config:
      default: ${TEST_PYPI_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_owner}
          repo: ${github_repo}
          secret_name: PYPI_API_TOKEN
          environment: testpypi
    rotation_period: 90d

  - name: cloudflare_pages_api_token
    description: Cloudflare Pages API token for deploying documentation to docs.secret0.com
    kind: static
    config:
      default: ${CLOUDFLARE_PAGES_API_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_owner}
          repo: ${github_repo}
          secret_name: CLOUDFLARE_PAGES_API_TOKEN
    rotation_period: 180d

  - name: github_token
    description: GitHub Token for container registry access (GHCR) and API operations
    kind: static
    config:
      default: ${GITHUB_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_owner}
          repo: ${github_repo}
          secret_name: GITHUB_TOKEN

  # ============================================================================
  # DEVELOPMENT/TEST SECRETS - HIGH CONFIDENCE
  # ============================================================================
  # These are confirmed from Secretfile.test.yml and local development setup
  
  - name: test_db_password
    description: Random password for test database stored in localstack SSM
    kind: random_password
    config:
      length: 32
      special: true
      uppercase: true
      lowercase: true
      digits: true
      exclude_characters: '"@/\`'
    targets:
      - provider: aws
        kind: ssm_parameter
        config:
          name: /test/database/password
          type: SecureString
          overwrite: true

  - name: test_api_key
    description: Random API key for testing authentication flows
    kind: random_string
    config:
      length: 48
      charset: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
    targets:
      - provider: aws
        kind: ssm_parameter
        config:
          name: /test/api/key
          type: SecureString
          overwrite: true

  - name: test_secret_manager_key
    description: Random API key stored in AWS Secrets Manager for testing
    kind: random_string
    config:
      length: 48
      charset: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
    targets:
      - provider: aws
        kind: secrets_manager
        config:
          name: test/api/key
          description: Test API key in Secrets Manager

  - name: test_json_secret
    description: JSON secret stored in LocalStack Secrets Manager
    kind: random_password
    config:
      length: 24
      special: true
    targets:
      - provider: aws
        kind: secrets_manager
        config:
          name: test/json-secret
          description: Test secret stored in Secrets Manager

  # ============================================================================
  # EXAMPLE/DOCUMENTATION SECRETS - MEDIUM/LOW CONFIDENCE
  # ============================================================================
  # These patterns appear in examples and documentation, suggesting they may be
  # useful for user deployments using SecretZero, but are not used in the core
  # SecretZero project itself.
  
  - name: aws_access_key_id
    description: AWS Access Key ID for programmatic access
    kind: static
    config:
      default: ${AWS_ACCESS_KEY_ID}
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/aws
          key: access_key_id

  - name: aws_secret_access_key
    description: AWS Secret Access Key for programmatic access
    kind: static
    config:
      default: ${AWS_SECRET_ACCESS_KEY}
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/aws
          key: secret_access_key

  - name: vault_token
    description: Vault authentication token for API access
    kind: static
    config:
      default: ${VAULT_TOKEN}
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/vault
          key: token

  - name: kubernetes_service_account_token
    description: Kubernetes service account token for cluster authentication
    kind: static
    config:
      default: ${K8S_SERVICE_ACCOUNT_TOKEN}
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/kubernetes
          key: service_account_token

  - name: gitlab_personal_access_token
    description: GitLab Personal Access Token (found in documentation examples)
    kind: static
    config:
      default: ${GITLAB_PERSONAL_ACCESS_TOKEN}
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/gitlab
          key: personal_access_token

  - name: stripe_secret_key
    description: Stripe API secret key (found in documentation examples)
    kind: static
    config:
      default: ${STRIPE_SECRET_KEY}
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/stripe
          key: secret_key

  - name: generic_api_key
    description: Generic API key pattern detected in multiple example files
    kind: random_string
    config:
      length: 64
      charset: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_
    targets:
      - provider: vault
        kind: vault_kv
        config:
          path: secret/generic
          key: api_key

  # ============================================================================
  # LABELS FOR CATEGORIZATION
  # ============================================================================
  
labels:
  source:
    primary-config: "From Secretfile.yml, .env, and workflow files"
    test-config: "From Secretfile.test.yml"
    documentation: "From documentation examples and source code comments"
  confidence:
    high: "Directly found in config or .env files"
    medium: "Inferred from CI/CD workflows or active configuration"
    low: "Found in documentation or example files only"

annotations:
  detection_scan_date: "2026-02-21"
  detection_tools: ["gitleaks", "trivy", "trufflehog", "detect-secrets"]
  gitleaks_results: "264 findings - most in documentation; 0 in source code"
  trivy_results: "7 findings - mostly in generated docs and site files"
  trufflehog_results: "detected JSON formatting issues"
  detect_secrets_results: "0 baseline entries"
  notes: |
    This detection file was generated by scanning the SecretZero project for
    secrets using multiple tools. The results show:
    
    1. NO active secrets found in source code (gitleaks: 0 findings in code)
    2. Examples and documentation contain mock secrets for illustration purposes
    3. Real secrets are referenced via environment variables (e.g., ${PYPI_API_TOKEN})
    4. Project follows security best practices using GitHub Actions trusted publishing
    
    RECOMMENDED NEXT STEPS:
    1. Review high-confidence secrets and confirm they match your setup
    2. Remove or comment out low-confidence example secrets you don't need
    3. For production use, populate environment variables in your CI/CD system
    4. Consider rotating PyPI tokens as they were found in plaintext in .env (testing only)
    5. Implement proper secret storage (GitHub Secrets, Vault, AWS Secrets Manager, etc.)
