[project]
name = "secretzero"
dynamic = ["version"]
#version = "0.1.0"
description = "A secrets orchestration, lifecycle, and bootstrap engine for code repositories"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

authors = [
    {name = "Zachary Loeber"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=50.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "click>=8.4.2",
    "jinja2>=3.1.6",
    "pygments>=2.21.0",
    "rich>=15.0.0",
    "setuptools-scm>=10.2.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.32",
]

[project.urls]
Homepage = "https://github.com/zloeber/SecretZero"
Documentation = "https://secret0.com"
Issues = "https://github.com/zloeber/SecretZero/issues"
CI = "https://github.com/zloeber/SecretZero/actions"

[tool.uv]
exclude-newer = "7 days"
# CVE-2026-4539: pygments fix is often newer than the exclude-newer window.
exclude-newer-package = { aiohttp = false, ansible-core = false, anthropic = false, cryptography = false, idna = false, langchain-anthropic = false, langchain-core = false, langchain-openai = false, langsmith = false, lxml = false, mcp = false, msgpack = false, ollama = false, pillow = false, pip = false, pygments = false, pyjwt = false, pymdown-extensions = false, pytest = false, python-multipart = false, setuptools = false, starlette = false, urllib3 = false }
# Pin transitive minimums when pip-audit fix releases are newer than exclude-newer allows.
override-dependencies = [
    "aiohttp>=3.14.3",
    "ansible-core>=2.21.3",
    "anthropic>=1.0.0",
    "black>=26.5.1",
    "cryptography>=50.0.0",
    "idna>=3.19",
    "langchain-anthropic>=1.6.1",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "msgpack>=1.2.1",
    "lxml>=6.1.2",
    "mcp>=1.28.1,<2",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "pip>=26.2.1",
    "pyjwt>=2.13.0",
    "pymdown-extensions>=11.0.1",
    "pytest>=9.1.1,<9.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "setuptools>=84.0.0",
    "starlette>=1.6.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<9.2",
    "tavern>=3.6.1",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "types-pyyaml",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]
aws = [
    "boto3>=1.43.71",
]
azure = [
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.1",
]
entra_agent_id = [
    "azure-identity>=1.25.3",
    "requests>=2.34.2",
]
vault = [
    "hvac>=2.4.0",
]
ansible_vault = [
    "ansible-vault>=4.1.0",
]
github = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
]
gitlab = [
    "python-gitlab>=8.5.0",
]
jenkins = [
    "python-jenkins>=1.8.3",
]
kubernetes = [
    "kubernetes>=36.0.3",
]
infisical = [
    "httpx>=0.28.1",
]
vercel = [
    "requests>=2.34.2",
]
keeper = [
    "keepercommander>=18.1.0",
]
azure-devops = []
cicd = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=8.5.0",
    "python-jenkins>=1.8.3",
    "requests>=2.34.2",
]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.32",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
    "mkdocs-click>=0.9.0",
    "mkdocs-swagger-ui-tag>=0.8.1",
]
ai = [
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-anthropic>=1.6.1",
]
security = [
    "bandit",
    "pip-audit",
]
demos = [
    "asciinema>=2.4.0",
    "termtosvg",
    "pyte",
    "wcwidth",
]
all = [
    "ansible-vault>=4.1.0",
    "boto3>=1.43.71",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.1",
    "requests>=2.34.2",
    "hvac>=2.4.0",
    "httpx>=0.28.1",
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=8.5.0",
    "python-jenkins>=1.8.3",
    "kubernetes>=36.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.32",
    "keepercommander>=18.1.0",
]
mcp = [
    "mcp>=1.28.1,<2",
]

[project.entry-points."secretzero.providers"]
aws = "secretzero.providers.aws:_get_bundle_manifest"
azure = "secretzero.providers.azure:_get_bundle_manifest"
vault = "secretzero.providers.vault:_get_bundle_manifest"
github = "secretzero.providers.github:_get_bundle_manifest"
gitlab = "secretzero.providers.gitlab:_get_bundle_manifest"
jenkins = "secretzero.providers.jenkins:_get_bundle_manifest"
kubernetes = "secretzero.providers.kubernetes:_get_bundle_manifest"
ansible_vault = "secretzero.providers.ansible_vault:_get_bundle_manifest"
sops = "secretzero.providers.sops:_get_bundle_manifest"
git_crypt = "secretzero.providers.git_crypt:_get_bundle_manifest"
infisical = "secretzero.providers.infisical:_get_bundle_manifest"
entra_agent_id = "secretzero.providers.entra_agent_id:_get_bundle_manifest"
vercel = "secretzero.providers.vercel:_get_bundle_manifest"
keeper = "secretzero.providers.keeper:_get_bundle_manifest"
azure_devops = "secretzero.providers.azure_devops:_get_bundle_manifest"

[project.scripts]
secretzero = "secretzero.cli:main"
secretzero-api = "secretzero.api.server:run"
secretzero-mcp = "secretzero.cli_mcp:run_legacy_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/secretzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --cov=secretzero --cov-report=term-missing"
# Tavern HTTP tests (tests/e2e) register via the pytest plugin; run `task test:e2e` for those only.

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "records", ".metagit", "examples", "docs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "F401", "F403", "F405", "W293", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
version_file = "src/secretzero/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secretzero*"]

[tool.setuptools.package-data]
secretzero = ["data/**/*"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
