[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretzero"
version = "0.1.0"
description = "A secrets orchestration, lifecycle, and bootstrap engine for code repositories"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zachary Loeber"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml",
    "httpx>=0.25.0",
    "pytest-asyncio>=0.21.0",
]
aws = [
    "boto3>=1.26.0",
]
azure = [
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
]
vault = [
    "hvac>=1.0.0",
]
github = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
]
gitlab = [
    "python-gitlab>=4.0.0",
]
jenkins = [
    "python-jenkins>=1.8.0",
]
kubernetes = [
    "kubernetes>=28.0.0",
]
cicd = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=4.0.0",
    "python-jenkins>=1.8.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]
all = [
    "boto3>=1.26.0",
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
    "hvac>=1.0.0",
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=4.0.0",
    "python-jenkins>=1.8.0",
    "kubernetes>=28.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
secretzero = "secretzero.cli:main"
secretzero-api = "secretzero.api.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/secretzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=secretzero --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
