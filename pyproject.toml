[project]
name = "secretzero"
dynamic = ["version"]
#version = "0.1.0"
description = "A secrets orchestration, lifecycle, and bootstrap engine for code repositories"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

authors = [
    {name = "Zachary Loeber"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
    "rich>=13.0.0",
    "setuptools-scm>=8.3.1",
]

[project.urls]
Homepage = "https://github.com/zloeber/SecretZero"
Documentation = "https://secret0.com"
Issues = "https://github.com/zloeber/SecretZero/issues"
CI = "https://github.com/zloeber/SecretZero/actions"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml",
    "httpx>=0.25.0",
    "pytest-asyncio>=0.21.0",
]
aws = [
    "boto3>=1.26.0",
]
azure = [
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
]
vault = [
    "hvac>=1.0.0",
]
ansible_vault = [
    "ansible-vault>=2.1.0",
]
github = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
]
gitlab = [
    "python-gitlab>=4.0.0",
]
jenkins = [
    "python-jenkins>=1.8.0",
]
kubernetes = [
    "kubernetes>=28.0.0",
]
infisical = [
    "httpx>=0.24.0",
]
cicd = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=4.0.0",
    "python-jenkins>=1.8.0",
]
api = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.22",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-click>=0.8.0",
    "mkdocs-swagger-ui-tag>=0.6.0",
]
ai = [
    "langchain-core>=1.0.0",
    "langgraph>=1.0.10",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
]
security = [
    "bandit",
    "pip-audit",
]
demos = [
    "asciinema>=2.4.0",
    "termtosvg",
    "pyte",
    "wcwidth",
]
all = [
    "ansible-vault>=2.1.0",
    "boto3>=1.26.0",
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
    "hvac>=1.0.0",
    "httpx>=0.24.0",
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=4.0.0",
    "python-jenkins>=1.8.0",
    "kubernetes>=28.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-click>=0.8.0",
    "mkdocs-swagger-ui-tag>=0.6.0",
]

[project.scripts]
secretzero = "secretzero.cli:main"
secretzero-api = "secretzero.api.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/secretzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=secretzero --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "records", ".metagit", "examples", "docs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "F401", "F403", "F405", "W293", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
version_file = "src/secretzero/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secretzero*"]

# [tool.setuptools.package-data]
# metagit = ["data/**/*"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
