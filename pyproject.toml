[project]
name = "secretzero"
dynamic = ["version"]
#version = "0.1.0"
description = "A secrets orchestration, lifecycle, and bootstrap engine for code repositories"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

authors = [
    {name = "Zachary Loeber"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=46.0.7",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
    "pygments>=2.20.0",
    "rich>=13.0.0",
    "setuptools-scm>=8.3.1",
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.27",
]

[project.urls]
Homepage = "https://github.com/zloeber/SecretZero"
Documentation = "https://secret0.com"
Issues = "https://github.com/zloeber/SecretZero/issues"
CI = "https://github.com/zloeber/SecretZero/actions"

[tool.uv]
exclude-newer = "7 days"
# CVE-2026-4539: pygments fix is often newer than the exclude-newer window.
exclude-newer-package = { anthropic = false, cryptography = false, idna = false, langchain-core = false, langchain-openai = false, langsmith = false, lxml = false, ollama = false, pip = false, pygments = false, pymdown-extensions = false, pytest = false, python-multipart = false, urllib3 = false }
# Pin transitive minimums when pip-audit fix releases are newer than exclude-newer allows.
override-dependencies = [
    "anthropic>=0.87.0",
    "black>=26.3.1",
    "cryptography>=46.0.7",
    "idna>=3.15",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langgraph>=1.0.10",
    "langsmith>=0.8.0",
    "lxml>=6.1.0",
    "ollama>=0.6.2",
    "pip>=26.0.2",
    "pyjwt>=2.12.0",
    "pymdown-extensions>=10.21.3",
    "pytest>=9.0.3",
    "python-multipart>=0.0.27",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "tavern>=2.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml",
    "httpx>=0.25.0",
    "pytest-asyncio>=0.21.0",
]
aws = [
    "boto3>=1.26.0",
]
azure = [
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
]
entra_agent_id = [
    "azure-identity>=1.12.0",
    "requests>=2.32.0",
]
vault = [
    "hvac>=1.0.0",
]
ansible_vault = [
    "ansible-vault>=2.1.0",
]
github = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
]
gitlab = [
    "python-gitlab>=4.0.0",
]
jenkins = [
    "python-jenkins>=1.8.0",
]
kubernetes = [
    "kubernetes>=28.0.0",
]
infisical = [
    "httpx>=0.24.0",
]
vercel = [
    "requests>=2.32.0",
]
keeper = [
    "keepercommander>=18.0.0",
]
cicd = [
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=4.0.0",
    "python-jenkins>=1.8.0",
]
api = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.27",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.21.3",
    "mkdocs-click>=0.8.0",
    "mkdocs-swagger-ui-tag>=0.6.0",
]
ai = [
    "langchain-core>=1.3.3",
    "langgraph>=1.0.10",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
]
security = [
    "bandit",
    "pip-audit",
]
demos = [
    "asciinema>=2.4.0",
    "termtosvg",
    "pyte",
    "wcwidth",
]
all = [
    "ansible-vault>=2.1.0",
    "boto3>=1.26.0",
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
    "requests>=2.32.0",
    "hvac>=1.0.0",
    "httpx>=0.24.0",
    "PyGithub>=2.1.0",
    "PyNaCl>=1.5.0",
    "python-gitlab>=4.0.0",
    "python-jenkins>=1.8.0",
    "kubernetes>=28.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.27",
    "keepercommander>=18.0.0",
]

[project.scripts]
secretzero = "secretzero.cli:main"
secretzero-api = "secretzero.api.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/secretzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --cov=secretzero --cov-report=term-missing"
# Tavern HTTP tests (tests/e2e) register via the pytest plugin; run `task test:e2e` for those only.

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "records", ".metagit", "examples", "docs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "F401", "F403", "F405", "W293", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
version_file = "src/secretzero/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secretzero*"]

# [tool.setuptools.package-data]
# metagit = ["data/**/*"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
