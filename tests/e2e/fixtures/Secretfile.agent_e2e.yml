# yaml-language-server: $schema=../../../../Secretfile.schema.json
variables:
  project: e2eproj
agent:
  mode: human
  web_port_min: 40000
  web_port_max: 41000
secrets:
  - name: manual_token
    kind: static
    config: {}
    targets:
      - provider: local
        kind: file
        config:
          path: ./e2e-secrets.env
          format: dotenv
          key: MANUAL_TOKEN
    agent_instructions:
      summary: "Set token for {{ secret_name }} (project {{ var.project }})"
      steps:
        - action: "Obtain token"
          description: "Complete provider signup"
