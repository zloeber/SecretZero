# yaml-language-server: $schema=https://github.com/zloeber/SecretZero/raw/refs/heads/main/Secretfile.schema.json
variables:
  project: e2eproj
  environment: dev
  env_file_suffix: dev
agent:
  mode: human
  web_port_min: 40000
  web_port_max: 41000
secrets:
  - name: manual_token
    kind: static
    config: {}
    targets:
      - provider: local
        kind: file
        config:
          path: ./e2e-secrets.env
          format: dotenv
          key: MANUAL_TOKEN
    agent_instructions:
      summary: "Set token for {{ secret_name }} (project {{ var.project }})"
      steps:
        - action: "Obtain token"
          description: "Complete provider signup"
  - name: rotatable_password
    kind: random_password
    rotation_period: "1h"
    config:
      length: 24
      include_numbers: true
      include_symbols: false
    targets:
      - provider: local
        kind: file
        config:
          path: ./e2e-{{ var.environment }}.env
          format: dotenv
          key: ROTATABLE_PASSWORD
  - name: cross_target_shared
    kind: random_string
    config:
      length: 32
      include_numbers: true
      include_symbols: false
    targets:
      - provider: local
        kind: file
        config:
          path: ./e2e-shared-a.env
          format: dotenv
          key: CROSS_TARGET_SHARED
      - provider: local
        kind: file
        config:
          path: ./e2e-shared-b.env
          format: dotenv
          key: CROSS_TARGET_SHARED
  - name: azure_app_registration_seed
    kind: azure_app_reg
    config:
      value:
        tenant_id: null
        client_id: null
        client_secret: null
    targets:
      - provider: local
        kind: file
        config:
          path: ./e2e-azure-app-reg.env
          format: dotenv
          key: AZURE_APP_REGISTRATION_SEED
    agent_instructions:
      summary: "Request Entra app registration secret for {{ secret_name }}"
      steps:
        - action: "Open Entra ID app registrations"
          description: "Create or select the application"
        - action: "Generate client secret"
          description: "Copy tenant_id, client_id, and client_secret"
