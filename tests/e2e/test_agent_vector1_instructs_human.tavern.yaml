---
test_name: agent vector1 instructs human (rendered instructions, no secret values)

stages:
  - name: agent sync dry run returns pending manual secrets with templated summary
    request:
      url: "{tavern.env_vars.SECRETZERO_E2E_BASE}/agent/sync"
      method: POST
      headers:
        Content-Type: application/json
      json:
        dry_run: true
    response:
      status_code: 200
      verify_response_with:
        - function: e2e.tavern_helpers:assert_vector1_pending_manual
