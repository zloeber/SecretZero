# Link checker for README.md and docs/. Run: task docs:links

verbose = "warn"
no_progress = true
max_redirects = 10
timeout = 25
exclude_loopback = true
include_mail = false

# Bot-blocked or example-only URLs (not doc defects)
exclude = [
  '^https://myvault\.vault\.azure\.net',
  '^https://jenkins\.example\.com',
  '^https://github\.com/yourusername/',
  '^https://gitlab\.com/-/profile/personal_access_tokens',
  '^https://www\.hhs\.gov/hipaa',
]
