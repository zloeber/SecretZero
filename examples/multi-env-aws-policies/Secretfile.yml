variables:
  project: payments-api
  # Local developer defaults. Override with --var-file for AWS lanes.
  aws_region: us-east-1
  expected_aws_account: "111111111111"
  expected_aws_role: secretzero-dev-sync

providers:
  local:
    kind: local
    config: {}
  aws:
    kind: aws
    auth:
      kind: ambient
      config:
        region: "{{ var.aws_region }}"

policies:
  aws_target_identity:
    kind: provider_identity
    description: Only allow sync when authenticated identity matches the target lane.
    providers: [aws]
    match: all
    rules:
      - field: account
        glob: "{{ var.expected_aws_account }}"
      - field: arn
        glob: "arn:aws:sts::{{ var.expected_aws_account }}:assumed-role/{{ var.expected_aws_role }}/*"
      - field: region
        glob: "{{ var.aws_region }}"

secrets:
  # Local development only. Keep this file out of git.
  - name: app_local_db_password
    kind: random_password
    one_time: true
    config:
      length: 24
      special: true
      exclude_characters: "\"@/\\`"
    targets:
      - provider: local
        kind: file
        config:
          path: .env.local
          format: dotenv
          merge: true
          key: APP_DB_PASSWORD

  # AWS dev lane (account + role + region constrained by var file).
  - name: app_dev_api_token
    kind: random_string
    config:
      length: 48
    targets:
      - provider: aws
        kind: secrets_manager
        identity_policies: [aws_target_identity]
        config:
          name: "/{{ var.project }}/dev/api/token"
          description: "Dev API token for {{ var.project }}"

  # AWS staging lane.
  - name: app_staging_api_token
    kind: random_string
    config:
      length: 48
    targets:
      - provider: aws
        kind: secrets_manager
        identity_policies: [aws_target_identity]
        config:
          name: "/{{ var.project }}/staging/api/token"
          description: "Staging API token for {{ var.project }}"

  # AWS production lane.
  - name: app_prod_api_token
    kind: random_string
    config:
      length: 64
    targets:
      - provider: aws
        kind: secrets_manager
        identity_policies: [aws_target_identity]
        config:
          name: "/{{ var.project }}/prod/api/token"
          description: "Production API token for {{ var.project }}"
