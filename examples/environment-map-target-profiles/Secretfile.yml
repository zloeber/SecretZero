# yaml-language-server: $schema=https://github.com/zloeber/SecretZero/raw/refs/heads/main/Secretfile.schema.json
variables:
  env: dev
  aws_region: us-east-1

environments:
  default: dev
  profiles:
    dev:
      var_files: ["examples/environment-map-target-profiles/dev.szvar"]
      lockfile: "examples/environment-map-target-profiles/.gitsecrets.dev.lock"
      target_profile: aws_dev
    staging:
      var_files: ["examples/environment-map-target-profiles/staging.szvar"]
      lockfile: "examples/environment-map-target-profiles/.gitsecrets.staging.lock"
      target_profile: aws_staging
    prod:
      var_files: ["examples/environment-map-target-profiles/prod.szvar"]
      lockfile: "examples/environment-map-target-profiles/.gitsecrets.prod.lock"
      target_profile: aws_prod

policies:
  aws_env_identity:
    kind: provider_identity
    providers: [aws]
    match: all
    rules:
      - field: account
        glob: "{{ var.aws_account_id }}"
      - field: region
        glob: "{{ var.aws_region }}"

target_profiles:
  aws_dev:
    identity_policies: [aws_env_identity]
    target_overrides:
      secrets_manager:
        name: /dev/default-token
  aws_staging:
    identity_policies: [aws_env_identity]
    target_overrides:
      secrets_manager:
        name: /staging/default-token
  aws_prod:
    identity_policies: [aws_env_identity]
    target_overrides:
      secrets_manager:
        name: /prod/default-token

providers:
  aws:
    kind: aws
    auth:
      kind: ambient

secrets:
  - name: app_api_token
    kind: static
    one_time: true
    config:
      validation: "^[A-Za-z0-9._-]{20,}$"
    targets:
      - provider: aws
        kind: secrets_manager
        config:
          name: /${env}/app/api-token
