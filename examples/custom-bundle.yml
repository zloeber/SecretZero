# Custom Provider Bundle Example
#
# This Secretfile demonstrates using a third-party provider bundle
# installed via pip (e.g. `pip install secretzero-mycloud`).
#
# The provider, generator, and target kinds become available automatically
# once the bundle package is installed — no configuration needed.
#
# See: https://secret0.com/extending/


# ---------------------------------------------------------------------------
# Providers — "mycloud" comes from the secretzero-mycloud bundle
# ---------------------------------------------------------------------------
providers:
  mycloud:
    kind: mycloud                       # matches BundleManifest.name
    auth:
      kind: token
      config:
        token: ${MYCLOUD_TOKEN}         # resolved from environment
    config:
      region: us-east-1
      endpoint: https://api.mycloud.example.com

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  # Use a bundle-provided generator
  - name: api_key
    kind: mycloud_token                # from the bundle's generators map
    config:
      length: 48
      prefix: "mc_live_"
    targets:
      # Store in MyCloud (bundle-provided target)
      - provider: mycloud
        kind: mycloud_secret           # from the bundle's targets map
        config:
          path: /production/api_key
      # Also store locally for dev use
      - provider: local
        kind: file
        config:
          path: .env
          format: dotenv

  # Use a built-in generator with a bundle-provided target
  - name: db_password
    kind: random_password
    config:
      length: 32
      include_symbols: true
    targets:
      - provider: mycloud
        kind: mycloud_secret
        config:
          path: /production/db_password

  # Multiple bundles can coexist
  # (assuming secretzero-certgen is also installed)
  - name: tls_cert
    kind: x509_cert                    # from the certgen bundle
    config:
      common_name: "app.example.com"
      validity_days: 365
    targets:
      - provider: local
        kind: file
        config:
          path: certs/app.pem
          format: raw
