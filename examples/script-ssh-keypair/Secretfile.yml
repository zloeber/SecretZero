# Script-generated SSH keypair example
# Demonstrates using the `script` generator with local file targets.

variables:
  key_dir: examples/script-ssh-keypair/.secrets
  key_name: deploy_key_ed25519

secrets:
  - name: deploy_ssh_keypair
    kind: templates.ssh_keypair

templates:
  ssh_keypair:
    description: Deployment SSH keypair generated locally with ssh-keygen
    fields:
      private_key:
        description: Private SSH key (OpenSSH format)
        generator:
          kind: script
          config:
            command: zsh
            args:
              - -c
              - >-
                set -euo pipefail;
                key_dir="${key_dir}";
                key_path="${key_dir}/${key_name}";
                mkdir -p "${key_dir}";
                if [ ! -f "${key_path}" ] || [ ! -f "${key_path}.pub" ]; then
                  ssh-keygen -t ed25519 -a 100 -N "" -C "secretzero-example" -f "${key_path}" >/dev/null;
                fi;
                cat "${key_path}"
            timeout: 30
      public_key:
        description: Public SSH key
        generator:
          kind: script
          config:
            command: zsh
            args:
              - -c
              - >-
                set -euo pipefail;
                key_dir="${key_dir}";
                key_path="${key_dir}/${key_name}";
                mkdir -p "${key_dir}";
                if [ ! -f "${key_path}" ] || [ ! -f "${key_path}.pub" ]; then
                  ssh-keygen -t ed25519 -a 100 -N "" -C "secretzero-example" -f "${key_path}" >/dev/null;
                fi;
                cat "${key_path}.pub"
            timeout: 30
    targets:
      - provider: local
        kind: file
        config:
          path: examples/script-ssh-keypair/generated/ssh-keypair.yml
          format: yaml
          merge: true

metadata:
  project: script-ssh-keypair-example
  owner: secretzero
