variables:
  gitlab_group: auto
  gitlab_project: auto

providers:
  gitlab:
    kind: gitlab
    auth:
      kind: token
      config:
        token: ${GITLAB_TOKEN}

secrets:
  - name: ci_automation_bot
    kind: gitlab_group_service_account
    config:
      provider: gitlab
      group: auto
      service_account_name: secretzero-ci-bot
      token_name: secretzero-ci-token
      scopes: [api, read_repository, write_repository]
      expires_in_days: 90
      rotate_existing: true
      memberships:
        - resource_type: project
          resource: auto
          access_level: 30
    targets:
      - provider: gitlab
        kind: gitlab_group_variable
        config:
          group: auto
          masked: true
          protected: true
          value_field: token
