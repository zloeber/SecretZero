# Example: sync secrets into a Terraform .tfvars file (gitignored in real repos).
version: "1"

providers:
  local:
    kind: local

secrets:
  - name: cloudflare_api_token
    kind: static
    config:
      value: null
    targets:
      - provider: local
        kind: file
        config:
          path: terraform/terraform.tfvars
          format: tfvars
          merge: true
          key: cloudflare_api_token
