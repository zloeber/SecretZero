# ## Benefits

# ### Single Source of Truth
# - All secrets defined in one configuration file
# - Consistent naming across platforms
# - Centralized secret management

# ### Automated Synchronization
# - Update secrets in all platforms with one command
# - Ensure consistency across CI/CD systems
# - Reduce manual secret management errors

# ### Audit Trail
# - Lockfile tracks all secret changes
# - Know when secrets were created and last updated
# - Compliance-friendly documentation

# ### Easy Rotation
# - Rotate secrets across all platforms simultaneously
# - No need to manually update each platform
# - Automated rotation policies

# ## Secret Lifecycle

# ### Initial Bootstrap
# ```bash
# # First time setup - generates and distributes all secrets
# secretzero sync -f examples/multi-cicd.yml
# ```

# ### Secret Rotation
# ```bash
# # After 90 days (or based on rotation_period)
# secretzero sync -f examples/multi-cicd.yml --force-rotate
# ```

# ### Adding New Platform
# ```yaml
# # Add a new target to existing secret
# targets:
#   - provider: new_provider
#     kind: new_target_type
#     config:
#       ...
# ```

# ```bash
# # Sync to distribute to new platform
# secretzero sync -f examples/multi-cicd.yml
# ```

# ## Migration Strategy

# ### Migrating from Manual Secret Management

# 1. **Inventory existing secrets** in each platform
# 2. **Create Secretfile.yml** with all secrets
# 3. **Use `one_time: true`** for secrets that shouldn't change
# 4. **Run dry-run** to verify what will be updated
# 5. **Sync in stages** (one platform at a time if preferred)
# 6. **Verify** in each platform's UI
# 7. **Update** pipelines to use new secret names if needed

# ### Example Migration

# ```yaml
# secrets:
#   # Existing secret - preserve current value
#   - name: legacy_api_key
#     kind: static
#     config:
#       default: ${LEGACY_API_KEY}  # Read from environment
#     one_time: true  # Don't regenerate
#     targets:
#       # Add to all platforms
# ```

# ## Best Practices

# 1. **Use descriptive names** that work across all platforms
# 2. **Set `one_time: true`** for external service credentials
# 3. **Use `rotation_period`** for generated secrets
# 4. **Test connectivity** before syncing
# 5. **Use dry-run** before making changes
# 6. **Commit Secretfile.yml** to version control
# 7. **Never commit** the lockfile or authentication tokens
# 8. **Use environment-specific** secrets where appropriate
# 9. **Document** secret purposes in descriptions
# 10. **Rotate regularly** according to security policies

# ## Troubleshooting

# ### Secret Mismatch
# If secrets differ between platforms:
# ```bash
# # Force resync to all platforms
# secretzero sync -f examples/multi-cicd.yml --force
# ```

# ### Platform-Specific Issues
# Test each provider independently:
# ```bash
# secretzero test -f examples/multi-cicd.yml
# ```

# ### Partial Sync Failure
# If one platform fails, others may succeed. Check the output for errors and retry the failed platform.

# ## Security Considerations

# 1. **Token Storage**: Store authentication tokens securely (1Password, HashiCorp Vault, etc.)
# 2. **Token Rotation**: Rotate platform tokens regularly
# 3. **Access Control**: Limit who can run `secretzero sync`
# 4. **Audit Logs**: Review platform audit logs for unexpected changes
# 5. **Encryption**: All secrets are encrypted in transit and at rest by the platforms
# 6. **Principle of Least Privilege**: Grant minimum required permissions to service accounts

# ## Cost Optimization

# - GitHub: Repository secrets are free, organization secrets may require GitHub Enterprise
# - GitLab: All tiers include CI/CD variables
# - Jenkins: Free, but consider infrastructure costs
# - SecretZero: Open source, free to use
