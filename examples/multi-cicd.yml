# # Multi-CI/CD Platform Integration Example

# This example demonstrates using SecretZero to manage secrets across GitHub Actions, GitLab CI/CD, and Jenkins simultaneously.

# ## Use Case

# Many organizations use multiple CI/CD platforms:
# - GitHub Actions for open-source projects
# - GitLab CI/CD for internal projects
# - Jenkins for legacy pipelines

# SecretZero allows you to manage all these secrets from a single source of truth.

# ## Configuration

# ```yaml

variables:
  # GitHub variables
  github_org: myorg
  github_repo: myrepo
  
  # GitLab variables
  gitlab_project: mygroup/myproject
  
  # Jenkins variables
  jenkins_url: https://jenkins.example.com

providers:
  github:
    kind: github
    auth:
      kind: token
      config:
        token: ${GITHUB_TOKEN}
  
  gitlab:
    kind: gitlab
    auth:
      kind: token
      config:
        token: ${GITLAB_TOKEN}
  
  jenkins:
    kind: jenkins
    auth:
      kind: token
      config:
        url: ${jenkins_url}
        username: ${JENKINS_USERNAME}
        token: ${JENKINS_TOKEN}

secrets:
  # Shared API key across all platforms
  - name: external_api_key
    kind: random_string
    config:
      length: 40
      charset: alphanumeric
    one_time: true  # Generate once, never change
    targets:
      # Local development
      - provider: local
        kind: file
        config:
          path: .env
          format: dotenv
      
      # GitHub Actions
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
      
      # GitLab CI/CD
      - provider: gitlab
        kind: gitlab_variable
        config:
          project: ${gitlab_project}
          masked: true
      
      # Jenkins
      - provider: jenkins
        kind: jenkins_credential
        config:
          credential_id: external-api-key
          description: External API Key (SecretZero managed)

  # Database password - production only
  - name: database_password
    kind: random_password
    config:
      length: 32
      special: true
    rotation_period: 90d  # Rotate every 90 days
    targets:
      # GitHub environment secret
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
          environment: production
      
      # GitLab protected variable
      - provider: gitlab
        kind: gitlab_variable
        config:
          project: ${gitlab_project}
          protected: true
          masked: true
          environment_scope: production
      
      # Jenkins credential
      - provider: jenkins
        kind: jenkins_credential
        config:
          credential_id: db-password-prod
          description: Production Database Password

  # Docker registry credentials
  - name: docker_registry_password
    kind: static
    config:
      default: ${DOCKER_PASSWORD}
    targets:
      # GitHub Actions
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
      
      # GitLab CI/CD
      - provider: gitlab
        kind: gitlab_variable
        config:
          project: ${gitlab_project}
          masked: true
      
      # Jenkins username/password
      - provider: jenkins
        kind: jenkins_credential
        config:
          credential_id: docker-registry
          description: Docker Registry Credentials
          credential_type: username_password
          username: ${DOCKER_USERNAME}

  # AWS credentials for deployment
  - name: aws_access_key
    kind: static
    config:
      default: ${AWS_ACCESS_KEY_ID}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
      
      - provider: gitlab
        kind: gitlab_variable
        config:
          project: ${gitlab_project}
          masked: true
      
      - provider: jenkins
        kind: jenkins_credential
        config:
          credential_id: aws-access-key
          description: AWS Access Key
  
  - name: aws_secret_key
    kind: static
    config:
      default: ${AWS_SECRET_ACCESS_KEY}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
      
      - provider: gitlab
        kind: gitlab_variable
        config:
          project: ${gitlab_project}
          masked: true
      
      - provider: jenkins
        kind: jenkins_credential
        config:
          credential_id: aws-secret-key
          description: AWS Secret Key

  # Slack webhook for notifications (all platforms)
  - name: slack_webhook
    kind: static
    config:
      default: ${SLACK_WEBHOOK_URL}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
      
      - provider: gitlab
        kind: gitlab_variable
        config:
          project: ${gitlab_project}
      
      - provider: jenkins
        kind: jenkins_credential
        config:
          credential_id: slack-webhook
          description: Slack Notification Webhook
# ```

# ## Setup

# 1. **Install SecretZero with all CI/CD providers**:
#    ```bash
#    pip install secretzero[cicd]
#    ```

# 2. **Set up authentication for all platforms**:
#    ```bash
#    # GitHub
#    export GITHUB_TOKEN=ghp_your_github_token
   
#    # GitLab
#    export GITLAB_TOKEN=glpat-your_gitlab_token
   
#    # Jenkins
#    export JENKINS_USERNAME=admin
#    export JENKINS_TOKEN=your_jenkins_token
   
#    # External service credentials
#    export DOCKER_USERNAME=myuser
#    export DOCKER_PASSWORD=mypassword
#    export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
#    export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#    export SLACK_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz
#    ```

# 3. **Test all provider connections**:
#    ```bash
#    secretzero test -f examples/multi-cicd.yml
#    ```

# 4. **Perform a dry-run**:
#    ```bash
#    secretzero sync -f examples/multi-cicd.yml --dry-run
#    ```

# 5. **Sync secrets to all platforms**:
#    ```bash
#    secretzero sync -f examples/multi-cicd.yml
#    ```

