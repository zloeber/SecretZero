version: "1.0"

metadata:
  project: encrypted-repo-workflows-demo
  owner: platform-security
  description: Demonstrates encrypted-in-git provider targets (Ansible Vault, SOPS, git-crypt, BlackBox).

variables:
  lane: dev
  region: us-east-1

providers:
  local:
    kind: local

  repo_ansible:
    kind: ansible_vault
    auth:
      kind: ambient
      config:
        vault_password_env: ANSIBLE_VAULT_PASSWORD
    config:
      vault_file: "secrets/{{ var.lane }}/vault.secrets.yml"
      format: yaml

  repo_sops:
    kind: sops
    auth:
      kind: ambient
    config:
      sops_file: "secrets/{{ var.lane }}/sops.secrets.enc.yaml"
      format: yaml

  repo_gitcrypt:
    kind: git_crypt
    auth:
      kind: ambient
    config:
      secret_file: "secrets/{{ var.lane }}/gitcrypt.secrets.yaml"
      format: yaml


environments:
  default: dev
  profiles:
    dev:
      var_files:
        - dev.szvar
      lockfile: .gitsecrets.dev.lock
    staging:
      var_files:
        - staging.szvar
      lockfile: .gitsecrets.staging.lock
    prod:
      var_files:
        - prod.szvar
      lockfile: .gitsecrets.prod.lock

secrets:
  - name: app_db_password
    kind: random_password
    rotation_period: 90d
    config:
      length: 32
      special: true
      exclude_characters: "\"@/\\`"
    targets:
      - provider: local
        kind: file
        config:
          path: ".env.{{ var.lane }}"
          format: dotenv
          key: APP_DB_PASSWORD
      - provider: repo_ansible
        kind: ansible_vault_file
        config:
          key: APP_DB_PASSWORD
      - provider: repo_sops
        kind: sops_file
        config:
          key: APP_DB_PASSWORD
      - provider: repo_gitcrypt
        kind: git_crypt_file
        config:
          key: APP_DB_PASSWORD

  - name: app_api_token
    kind: random_string
    rotation_period: 60d
    config:
      length: 48
    targets:
      - provider: local
        kind: file
        config:
          path: ".env.{{ var.lane }}"
          format: dotenv
          key: APP_API_TOKEN
      - provider: repo_ansible
        kind: ansible_vault_file
        config:
          key: APP_API_TOKEN
      - provider: repo_sops
        kind: sops_file
        config:
          key: APP_API_TOKEN
      - provider: repo_gitcrypt
        kind: git_crypt_file
        config:
          key: APP_API_TOKEN
