repos:
  - repo: local
    hooks:
      - id: secretzero-security-scan
        name: secretzero security scan
        entry: zsh -lc 'task security:scan'
        language: system
        pass_filenames: false
        always_run: true
      - id: secretzero-docs-links
        name: secretzero docs link check (lychee)
        entry: zsh -lc 'task docs:links'
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/)
